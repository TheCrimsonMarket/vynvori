# REVIEW TEMPLATE ONLY. Resolve every REPLACE_* value after separate approval.
# IAM authentication must remain enabled; never grant allUsers/allAuthenticatedUsers.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vynvori-medusa-staging
  labels:
    cloud.googleapis.com/location: us-east1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/invoker-iam-disabled: 'false'
    run.googleapis.com/minScale: '0'
    run.googleapis.com/maxScale: '1'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'false'
    spec:
      serviceAccountName: vynvori-medusa-runtime@lucky-little-devil.iam.gserviceaccount.com
      containerConcurrency: 8
      timeoutSeconds: 60
      containers:
        - image: us-east1-docker.pkg.dev/lucky-little-devil/vynvori-staging-images/medusa@sha256:REPLACE_REVIEWED_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: M2_REMOTE_STAGING_APPROVAL
              value: m2-private-synthetic-staging-v1
            - name: M2_REMOTE_SOURCE_COMMIT
              value: REPLACE_REVIEWED_SOURCE_COMMIT
            - name: M2_ENV
              value: staging
            - name: M2_MEDUSA_DATABASE_NAME
              value: vynvori_medusa_staging
            - name: M2_MEDUSA_DATABASE_HOST
              value: REPLACE_VERIFIED_DIRECT_NEON_HOST
            - name: M2_MEDUSA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vynvori-medusa-database-url
                  key: REPLACE_NUMERIC_SECRET_VERSION
            - name: M2_MEDUSA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: vynvori-medusa-jwt-secret
                  key: REPLACE_NUMERIC_SECRET_VERSION
            - name: M2_MEDUSA_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: vynvori-medusa-cookie-secret
                  key: REPLACE_NUMERIC_SECRET_VERSION
            - name: M2_MEDUSA_STORE_CORS
              value: https://REPLACE_VERIFIED_VERCEL_HOST
            - name: M2_MEDUSA_ADMIN_CORS
              value: https://REPLACE_VERIFIED_OPERATOR_ORIGIN
            - name: M2_MEDUSA_AUTH_CORS
              value: https://REPLACE_VERIFIED_OPERATOR_ORIGIN
