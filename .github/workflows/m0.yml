name: M0 foundation
on:
  pull_request:
  push:
    branches: [main, feat/m0-platform-foundation]
permissions:
  contents: read
concurrency:
  group: m0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Deterministic security tests hash the immutable reviewed PR4 baseline.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - name: Fetch immutable PR5 policy implementation
        run: |
          node --input-type=module -e 'import { execFileSync } from "node:child_process"; import { PR5_IMPLEMENTATION_COMMIT as sha } from "./scripts/security/run-audit.mjs"; if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error("Unactivated local policy"); execFileSync("git", ["fetch", "--no-tags", "origin", sha], { stdio: "inherit" });'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Diagnose unexpected checkout mutations
        run: |
          git status --short --untracked-files=all
          git diff --stat
      - run: node --test scripts/tests/pr5-local-policy.test.mjs
      - run: npm run build:web
      - run: npm run build
      - run: npm run verify:reference
      - run: npm run smoke:security
      - run: npm ls --all --omit=optional
      - run: npm run test:deployment
      # Runs npm audit --omit=dev --json unfiltered, preserves its exit status,
      # The historical policy stays intact. PR5's separate local-only approval
      # also checks the full npm audit and a freshly built/scanned local image.
      - run: npm run security:audit
        if: always()
        env:
          PR5_SECURITY_SCOPE: local-synthetic-only
          M1B_SECURITY_SCOPE: m1b-github-ci-source-only
          SECURITY_AUDIT_EVIDENCE_DIR: ${{ runner.temp }}/m2-security-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m2-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m2-security-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run test:browser:web
        env:
          M0_BROWSER: chromium
          M0_EVIDENCE_DIR: ${{ runner.temp }}/m0-browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: m0-browser
          path: ${{ runner.temp }}/m0-browser
          if-no-files-found: error
