# Deployment template only. Replace all REQUIRED values after scope/cost approval.
# IAM: retain invoker IAM check; grant roles/run.invoker to explicit caller only.
# Never grant allUsers/allAuthenticatedUsers; never use --allow-unauthenticated.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vynvori-staging-image-processing
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
    spec:
      serviceAccountName: REQUIRED_DEDICATED_SERVICE_ACCOUNT
      containerConcurrency: 4
      timeoutSeconds: 15
      containers:
        - image: REQUIRED_ARTIFACT_REGISTRY_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 256Mi
          env:
            - name: M2_ENV
              value: staging
            - name: M2_PROCESSING_TOKEN
              valueFrom:
                secretKeyRef:
                  name: REQUIRED_STAGING_PROCESSING_SECRET
                  key: '1'
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 6
